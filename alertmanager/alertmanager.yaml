# alertmanager/alertmanager.yaml
# Handles routing, grouping, deduplication, and inhibition for all XRd alerts.
global:
  resolve_timeout: 5m

route:
  receiver: webhook
  # Group alerts by the device (source label) and event type.
  # Alerts sharing both labels within group_wait are bundled into one POST.
  group_by: [source, event_type]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # topology_degraded is topology-scoped, not per-device.
    # Group only by event_type so all devices contribute to one notification.
    - matchers:
        - event_type = "topology_degraded"
      group_by: [event_type]
      receiver: webhook

receivers:
  - name: webhook
    webhook_configs:
      # Alertmanager does not expand environment variables. The container
      # entrypoint (see compose.yaml) writes WEBHOOK_RECEIVER_URL to this file.
      - url_file: /tmp/webhook_url
        send_resolved: true

  - name: null_receiver
    # Intentionally empty — used to silently discard suppressed alerts.

inhibit_rules:
  # interface_state suppresses isis_adjacency_count for the same device. ISIS
  # adjacency loss is a known cascade of interface down; notify about the
  # interface root cause, not a second time for ISIS.
  - source_matchers:
      - event_type = "interface_state"
    target_matchers:
      - event_type = "isis_adjacency_count"
    equal: [source]

  # interface_state suppresses interface_flapping for the same
  # device+interface. A clean shutdown is not instability.
  - source_matchers:
      - event_type = "interface_state"
    target_matchers:
      - event_type = "interface_flapping"
    equal: [source, name]
